<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1976FF" />
  <title>扫码查价</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 模拟手机外壳(在 PC 浏览器也能直观预览) -->
  <div class="phone-shell">
    <div class="phone-screen" id="app">

      <!-- ========== 首页(图1) ========== -->
      <section class="view view-home" data-view="home">
        <div class="home-logo">
          <svg viewBox="0 0 120 120" class="qr-icon" aria-hidden="true">
            <path fill="currentColor" d="M10 10h40v40H10zm10 10v20h20V20zM70 10h40v40H70zm10 10v20h20V20zM10 70h40v40H10zm10 10v20h20V80z"/>
            <path fill="currentColor" d="M55 25h10v10H55zM70 40h10v5H70zM40 55h5v10h-5zM85 55h5v5h-5zM70 70h25v5H70zM55 85h5v5h-5zM75 95h5v5h-5zM95 95h10v5H95zM55 95h5v5h-5z"/>
          </svg>
        </div>
        <h1 class="home-title">扫码查价</h1>
        <p class="home-subtitle">扫描商品条形码，快速查询价格</p>

        <button class="btn btn-scan" id="btn-scan">
          <span class="btn-scan-icon">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h2v12H3zm3 0h1v12H6zm2 0h2v12H8zm3 0h1v12h-1zm2 0h3v12h-3zm4 0h1v12h-1zm2 0h2v12h-2z"/></svg>
          </span>
          扫码查价
        </button>

        <div class="home-manage" id="btn-manage">
          <div class="home-manage-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="56" height="56"><path fill="#5a5a5a" d="M19.14 12.94a7.6 7.6 0 0 0 .05-.94 7.6 7.6 0 0 0-.05-.94l2.03-1.58a.48.48 0 0 0 .12-.6l-1.92-3.32a.48.48 0 0 0-.58-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.94 2h-3.84a.48.48 0 0 0-.48.42l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.48.48 0 0 0-.58.22L2.75 8.48a.48.48 0 0 0 .12.6l2.03 1.58c-.03.31-.05.62-.05.94s.02.63.05.94L2.87 14.12a.48.48 0 0 0-.12.6l1.92 3.32c.13.23.41.32.65.22l2.39-.96c.49.39 1.03.7 1.62.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.24.1.52 0 .65-.22l1.92-3.32a.48.48 0 0 0-.12-.6l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
          </div>
          <div class="home-manage-label">商品管理</div>
        </div>
      </section>

      <!-- ========== 扫码页(图2入口) ========== -->
      <section class="view view-scan" data-view="scan" hidden>
        <header class="topbar">
          <button class="topbar-back" data-back>‹</button>
          <h2 class="topbar-title">扫码</h2>
          <div class="topbar-spacer"></div>
        </header>
        <div class="scan-stage">
          <video id="scan-video" playsinline muted></video>
          <div class="scan-frame">
            <span class="corner tl"></span><span class="corner tr"></span>
            <span class="corner bl"></span><span class="corner br"></span>
            <span class="scan-line"></span>
          </div>
          <div class="scan-tip" id="scan-tip">将条形码放入框内，自动识别</div>
        </div>
        <div class="scan-actions">
          <button class="btn btn-ghost" id="btn-manual-input">手动输入条码</button>
        </div>
      </section>

      <!-- ========== 商品详情(图2) ========== -->
      <section class="view view-detail" data-view="detail" hidden>
        <header class="topbar">
          <button class="topbar-back" data-back>‹</button>
          <h2 class="topbar-title">商品详情</h2>
          <div class="topbar-spacer"></div>
        </header>
        <div class="detail-card">
          <div class="detail-img" id="detail-img">
            <span class="detail-img-empty" id="detail-img-empty">暂无图片</span>
          </div>
          <div class="detail-name" id="detail-name">商品名称</div>
          <div class="detail-price">¥<span id="detail-price">0.00</span></div>
          <div class="detail-meta">
            <span class="detail-meta-label">条形码</span>
            <span class="detail-meta-value" id="detail-barcode">--</span>
          </div>
        </div>

        <div class="detail-countdown" id="detail-countdown">
          <span class="clock-icon" aria-hidden="true">⏱</span>
          <span id="countdown-text">4秒后自动返回首页</span>
        </div>

        <button class="btn btn-primary btn-voice" id="btn-voice">
          <span class="voice-icon" aria-hidden="true">🔊</span>
          语音报价
        </button>
      </section>

      <!-- ========== 商品管理列表(图3) ========== -->
      <section class="view view-manage" data-view="manage" hidden>
        <header class="topbar">
          <button class="topbar-back" data-back>‹</button>
          <h2 class="topbar-title">商品管理</h2>
          <button class="topbar-add" id="btn-add" aria-label="添加商品">+</button>
        </header>
        <div class="manage-list" id="manage-list"></div>
        <div class="manage-empty" id="manage-empty" hidden>
          <div class="empty-icon">📦</div>
          <div class="empty-text">还没有商品</div>
          <div class="empty-hint">点击右上角 + 添加第一个商品</div>
        </div>
      </section>

      <!-- ========== 添加 / 编辑商品(图4) ========== -->
      <section class="view view-form" data-view="form" hidden>
        <header class="topbar">
          <button class="topbar-back" data-back>‹</button>
          <h2 class="topbar-title" id="form-title">添加商品</h2>
          <div class="topbar-spacer"></div>
        </header>

        <form class="form" id="product-form" autocomplete="off">
          <input type="hidden" id="f-id" />

          <div class="form-row">
            <label class="form-label">条形码 <span class="required">*</span></label>
            <div class="form-barcode">
              <input type="text" id="f-barcode" placeholder="请输入或扫码" inputmode="numeric" required />
              <button type="button" class="btn btn-icon" id="f-scan-trigger" aria-label="扫码">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h2v12H3zm3 0h1v12H6zm2 0h2v12H8zm3 0h1v12h-1zm2 0h3v12h-3zm4 0h1v12h-1zm2 0h2v12h-2z"/></svg>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label">商品名称 <span class="required">*</span></label>
            <input type="text" id="f-name" placeholder="请输入商品名称" required />
          </div>

          <div class="form-row">
            <label class="form-label">价格 <span class="required">*</span></label>
            <input type="number" id="f-price" placeholder="请输入价格" step="0.01" min="0" required />
          </div>

          <div class="form-row">
            <label class="form-label">规格</label>
            <input type="text" id="f-spec" placeholder="请输入规格（可选）" />
          </div>

          <div class="form-row">
            <label class="form-label">商品图片 <span class="optional">（可选）</span></label>
            <label class="form-image" for="f-image">
              <input type="file" id="f-image" accept="image/*" hidden />
              <div class="form-image-placeholder" id="f-image-placeholder">
                <span class="form-image-icon" aria-hidden="true">＋</span>
                <span class="form-image-text">添加图片</span>
              </div>
              <img class="form-image-preview" id="f-image-preview" alt="" hidden />
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-save">保存</button>
        </form>
      </section>

      <!-- ========== 弹层:扫码(在表单页里复用) ========== -->
      <div class="modal" id="modal-scan" hidden>
        <div class="modal-content">
          <header class="topbar topbar-modal">
            <button class="topbar-back" id="modal-scan-close">‹</button>
            <h2 class="topbar-title">扫描条形码</h2>
            <div class="topbar-spacer"></div>
          </header>
          <div class="scan-stage scan-stage-modal">
            <video id="modal-video" playsinline muted></video>
            <div class="scan-frame">
              <span class="corner tl"></span><span class="corner tr"></span>
              <span class="corner bl"></span><span class="corner br"></span>
              <span class="scan-line"></span>
            </div>
            <div class="scan-tip">将条形码放入框内</div>
          </div>
        </div>
      </div>

      <!-- ========== 通用 Toast ========== -->
      <div class="toast" id="toast" hidden></div>
    </div>
  </div>

  <script>
    // 兜底:JS 加载出错时,直接在页面上显示
    window.addEventListener('error', function (e) {
      try {
        var banner = document.getElementById('js-error');
        if (!banner) {
          banner = document.createElement('div');
          banner.id = 'js-error';
          banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff3b30;color:#fff;padding:10px;font-size:13px;z-index:99999;white-space:pre-wrap;font-family:monospace;';
          document.body.appendChild(banner);
        }
        var msg = '';
        if (e && e.message) msg = e.message;
        if (e && e.filename) msg = msg + ' @ ' + e.filename + ':' + (e.lineno || 0);
        banner.textContent = '脚本错误: ' + msg;
      } catch (err) {}
    });
  </script>
  <script src="js/storage.js"></script>
  <script src="js/vendor/zxing.min.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
